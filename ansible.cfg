[defaults]
inventory = inventory/hosts.ini
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
# 交换机重启升级耗时长，放宽超时
timeout = 30
# 输出格式化为 yaml（新版 ansible 用 result_format，旧的 yaml 回调已移除）
result_format = yaml
# 并行台数（同时操作多少台交换机）
forks = 10

[ssh_connection]
# 保持连接、失败重连，适配交换机升级过程中的多次重启
retries = 3
ssh_args = -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null
pipelining = True
