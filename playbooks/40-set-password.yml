---
# 持久化设置 admin 密码到 NVOS 配置层（nv config），跨升级换分区保留。
#
# 背景：bootstrap-switch.exp 走首登交互改的是 Linux 层(/etc/shadow)，NVOS 升级
#       会装全新镜像到另一分区，Linux 层回到出厂 admin/admin → 密码“丢了”。
#       写进 nv config 并 save，升级时会随 startup 配置迁移到新分区，不再丢。
#
# 用法：
#   # 当前能用的密码在 group_vars 里(ansible_password)。若机器已回默认，先临时覆盖：
#   ansible-playbook playbooks/40-set-password.yml \
#       -e ansible_password=admin -e ansible_become_password=admin \
#       -e new_admin_password='admin'
#
#   # 若当前密码就是 group_vars 里的值，直接：
#   ansible-playbook playbooks/40-set-password.yml -e new_admin_password='admin'
#
#   只对某几台:  -l 192.0.2.190
#
# 说明：new_admin_password 不写死，必须 -e 传入，避免明文落库。
- name: Q3400 持久化设置 admin 密码（写入 nv config）
  hosts: q3400
  gather_facts: false
  become: true
  vars:
    # 目标新密码：必须通过 -e new_admin_password=... 传入
    new_admin_password: ""
  tasks:
    - name: "校验已传入 new_admin_password"
      ansible.builtin.assert:
        that:
          - new_admin_password | length > 0
        fail_msg: "必须用 -e new_admin_password='<新密码>' 传入目标密码"
        quiet: true

    - name: "设置 admin 密码（nv set system aaa user）"
      # 单引号包裹密码防止 shell 解析；raw 规避交换机可能无 python
      ansible.builtin.raw: "nv set system aaa user admin password '{{ new_admin_password }}'"
      register: nv_set
      changed_when: true

    - name: "应用配置（立即生效）"
      ansible.builtin.raw: "nv config apply --assume-yes"
      register: nv_apply
      changed_when: true

    - name: "保存到 startup（关键：跨升级/重启保留）"
      ansible.builtin.raw: "nv config save"
      register: nv_save
      changed_when: true

    - name: "结果"
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} 密码已写入 nv config 并 save。
          之后请把 group_vars 的 ansible_password / ansible_become_password 保持为该密码。
